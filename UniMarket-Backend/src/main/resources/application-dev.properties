# =====================================================================
# 'dev' profile: local development (active by default).
# Still uses ddl-auto=validate from application.properties.
# =====================================================================

# More detail from UniMarket code while developing. Set to INFO when not needed.
logging.level.com.unimarket=DEBUG

# Uncomment to print the SQL that Hibernate sends (parameters are not shown).
# spring.jpa.show-sql=true

# Local development: verification e-mails are written to the log instead of being sent,
# and missing JWT / verification secrets are replaced by random keys generated at startup
# (tokens and codes then stop working after a restart). Never use this profile in production.
unimarket.mail.mode=${MAIL_MODE:log}
unimarket.security.jwt.allow-ephemeral-secret=true
unimarket.security.verification.allow-ephemeral-secret=true
