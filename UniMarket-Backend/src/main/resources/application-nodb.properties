# =====================================================================
# 'nodb' profile: start the API WITHOUT a database connection.
# Useful when SQL Server is not installed or not running, e.g. to test
# GET /api/health and frontend-backend connectivity.
#
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=nodb"
#
# Do not use this profile once features depend on the database.
# =====================================================================

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Without a database there are no accounts: auth endpoints are not registered and every
# bearer token is rejected. Random keys are fine because nothing can be signed in anyway.
unimarket.mail.mode=log
unimarket.security.jwt.allow-ephemeral-secret=true
unimarket.security.verification.allow-ephemeral-secret=true
