# =====================================================================
# UniMarket backend configuration
# Credentials are NEVER stored here. They are read from environment
# variables or from an optional, git-ignored UniMarket-Backend/.env file.
# See UniMarket-Backend/.env.example.
# =====================================================================

spring.application.name=UniMarket
server.port=${SERVER_PORT:8080}

# Optionally load KEY=VALUE pairs from UniMarket-Backend/.env (git-ignored).
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Microsoft SQL Server
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniMarketDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------------------------------------------------------------------
# JPA / Hibernate
# 'validate' only checks entities against existing tables. It never
# creates, alters or drops anything. The schema is owned by
# database/schema.sql. Never use 'create' or 'create-drop' here.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
