# =====================================================================
# UniMarket backend configuration
# Credentials are NEVER stored here. They are read from environment
# variables or from an optional, git-ignored UniMarket-Backend/.env file.
# See UniMarket-Backend/.env.example.
# =====================================================================

spring.application.name=UniMarket
server.port=${SERVER_PORT:8080}

# Local development settings live in application-dev.properties.
# Another profile (e.g. 'nodb') can be chosen with SPRING_PROFILES_ACTIVE.
spring.profiles.default=dev

# Optionally load KEY=VALUE pairs from UniMarket-Backend/.env (git-ignored).
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Microsoft SQL Server (database created by UniMarket_BusinessAligned.sql)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniMarketJava;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.pool-name=UniMarketPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------
# JPA / Hibernate
# The SQL script is the source of truth for the schema. 'validate' only
# checks entities against existing tables; it never creates, alters or
# drops anything. NEVER use create, create-drop or update here.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Tables and columns use the exact names from the SQL script (e.g. Users.UserId),
# so entity names are not converted to snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# All timestamps in the database are UTC (SYSUTCDATETIME()). Entities use LocalDateTime holding the UTC
# wall-clock time (taken from Clock.systemUTC()), written and read without any time-zone conversion.
# Do NOT set hibernate.jdbc.time_zone: it would shift LocalDateTime values by the server's offset.
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------
# Errors: never send stack traces, exception or SQL details to clients.
# API errors are formatted by GlobalExceptionHandler.
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------------------
# Actuator: only /actuator/health, without component details.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# SMTP availability must not make the API look down (mail is only used for verification codes).
management.health.mail.enabled=false

# ---------------------------------------------------------------------
# Security (Backend Stage 2). Secrets come ONLY from the environment / .env.
# ---------------------------------------------------------------------
# JWT signing key: Base64 of at least 32 random bytes (HS256), e.g. `openssl rand -base64 48`.
unimarket.security.jwt.secret=${JWT_SECRET:}
unimarket.security.jwt.issuer=unimarket-api
unimarket.security.jwt.audience=unimarket-web
unimarket.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}
# Only the dev/test profiles may fall back to a random key generated at startup.
unimarket.security.jwt.allow-ephemeral-secret=false

# Verification codes: HMAC key (Base64, >= 32 bytes) used to hash codes before storing them.
unimarket.security.verification.secret=${VERIFICATION_CODE_SECRET:}
unimarket.security.verification.allow-ephemeral-secret=false
unimarket.security.verification.code-ttl=PT10M
unimarket.security.verification.max-attempts=5
unimarket.security.verification.resend-cooldown=PT60S
unimarket.security.verification.max-codes-per-hour=5

# Login throttling (per e-mail address, in memory).
unimarket.security.login.max-failures=5
unimarket.security.login.lockout=PT15M

# Browser origins allowed to call the API directly (comma separated). The Vite dev
# server proxies /api, so this is only needed when the frontend calls the API cross-origin.
unimarket.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------
# E-mail delivery (verification codes):
#   'smtp' sends real mail through SMTP. Approved provider: Gmail SMTP (smtp.gmail.com:587, STARTTLS) with the
#          dedicated sender account and a Google App Password, both ONLY from the environment / git-ignored .env
#          (MAIL_USERNAME, MAIL_PASSWORD). Never commit them and never put them in VITE_* variables.
#   'log'  only writes the message to the application log (local development / isolated tests; never in production).
# With MAIL_MODE=smtp a missing MAIL_USERNAME / MAIL_PASSWORD stops the startup (no silent fallback to logging codes).
# ---------------------------------------------------------------------
unimarket.mail.mode=${MAIL_MODE:smtp}
# Sender address (default: MAIL_USERNAME; Gmail only sends as the authenticated account or its verified aliases).
unimarket.mail.from=${MAIL_FROM:}
unimarket.mail.from-name=${MAIL_FROM_NAME:UniMarket}
# Log in to the SMTP server once at startup (no e-mail is sent) and log only "succeeded" / the failure type.
unimarket.mail.verify-on-startup=${MAIL_VERIFY_ON_STARTUP:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
# Fixed EHLO name: avoids a slow reverse-DNS lookup of this machine's name before every SMTP connection.
spring.mail.properties.mail.smtp.localhost=${MAIL_EHLO_NAME:localhost}

# ---------------------------------------------------------------------
# Listing photos (approved decision Q2): server disk, JPG/PNG/WebP, 5 MB each, 8 per listing.
# Files go to <UPLOAD_DIR>/products and are served read-only under /media/products/.
# ---------------------------------------------------------------------
unimarket.storage.upload-dir=${UPLOAD_DIR:uploads}
unimarket.listing.max-photos=8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=41MB
# Let Tomcat read the rest of a refused upload so the client receives the 413 JSON instead of a reset connection.
server.tomcat.max-swallow-size=42MB

# ---------------------------------------------------------------------
# Cart, checkout, orders and payments (Backend Stage 4)
# ---------------------------------------------------------------------
# V003 simulated shipping: fees are calculated by the backend per seller order (formula SIM-2026-11, free within 3 km)
# and paid online with the order; the seller receives all of it (D1, no commission). No real carrier is integrated.
# Quote tokens are HMAC-SHA256 signed with SHIPPING_QUOTE_SECRET (Base64, >= 32 bytes) and expire after the TTL.
unimarket.shipping.quote.secret=${SHIPPING_QUOTE_SECRET:}
unimarket.shipping.quote.allow-ephemeral-secret=false
unimarket.shipping.quote.ttl=PT15M
# Technical limit of listings in one cart (checkout accepts at most 50 listings).
unimarket.cart.max-items=50
# Order expiry job (usp_ExpirePendingOrders): seller 24 h confirmation and buyer 24 h payment deadlines (D2).
unimarket.orders.expiry.enabled=${ORDER_EXPIRY_ENABLED:true}
unimarket.orders.expiry.interval=${ORDER_EXPIRY_INTERVAL:PT1M}
unimarket.orders.expiry.initial-delay=PT30S
# SANDBOX payment simulator: OFF unless enabled. No real payment provider is integrated; never enable in production.
unimarket.payment.simulator.enabled=${PAYMENT_SIMULATOR_ENABLED:false}
unimarket.payment.simulator.secret=${PAYMENT_SIMULATOR_SECRET:}
unimarket.payment.simulator.allow-ephemeral-secret=false
