# =====================================================================
# UniMarket backend configuration
# Credentials are NEVER stored here. They are read from environment
# variables or from an optional, git-ignored UniMarket-Backend/.env file.
# See UniMarket-Backend/.env.example.
# =====================================================================

spring.application.name=UniMarket
server.port=${SERVER_PORT:8080}

# Local development settings live in application-dev.properties.
# Another profile (e.g. 'nodb') can be chosen with SPRING_PROFILES_ACTIVE.
spring.profiles.default=dev

# Optionally load KEY=VALUE pairs from UniMarket-Backend/.env (git-ignored).
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Microsoft SQL Server (database created by UniMarket_BusinessAligned.sql)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniMarketJava;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.pool-name=UniMarketPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------
# JPA / Hibernate
# The SQL script is the source of truth for the schema. 'validate' only
# checks entities against existing tables; it never creates, alters or
# drops anything. NEVER use create, create-drop or update here.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Tables and columns use the exact names from the SQL script (e.g. Users.UserId),
# so entity names are not converted to snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# All timestamps in the database are UTC (SYSUTCDATETIME()).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------
# Errors: never send stack traces, exception or SQL details to clients.
# API errors are formatted by GlobalExceptionHandler.
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------------------
# Actuator: only /actuator/health, without component details.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
