# Test-only overrides (loaded in addition to the main application.properties, with higher precedence).
# The expiry job is off in tests: tests run usp_ExpirePendingOrders themselves at controlled moments.
unimarket.orders.expiry.enabled=false
# Tests never use the real mail account from .env: codes are captured or logged; SMTP tests use a local mock server.
unimarket.mail.mode=log
unimarket.mail.verify-on-startup=false
